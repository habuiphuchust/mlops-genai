name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Chạy CI khi có thay đổi trên nhánh chính
  pull_request:
    branches:
      - main  # Chạy CI khi có pull request đến nhánh chính

jobs:
  test:
    runs-on: ubuntu-latest  # Chạy trên môi trường Ubuntu mới nhất

    steps:
    - name: Checkout code
      uses: actions/checkout@v2  # Kiểm tra mã nguồn

    - name: Set up Python
      uses: actions/setup-python@v4  # Cài đặt Python
      with:
        python-version: '3.12.7'  # Chọn phiên bản Python

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip  # Cập nhật pip
        pip install -r requirements.txt  # Cài đặt các dependencies trong file requirements.txt

    # - name: Set up database
    #   run: |
    #     sudo apt-get install libpq-dev  # Cài đặt PostgreSQL dependencies nếu dùng PostgreSQL
    #     sudo -u postgres psql -c 'CREATE DATABASE mydb;'  # Tạo database

    # - name: Run migrations
    #   run: |
    #     python manage.py migrate  # Chạy migrations để tạo cấu trúc database

    - name: Run tests
      run: |
        python manage.py test
  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out code from the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Log in to DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mlops-image:latest .

      # Step 4: Push the Docker image to DockerHub
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mlops-image:latest
